                '<input type="text" class="input" id="drPeerNote" placeholder="동료 평가 코멘트" value="' + escapeHtml(ev.peerSelf.peerNote) + '" />' +
                '</div>' +
                '<div class="rubric-card"><strong style="font-size:13px;">5. 수업 태도 및 교사 관찰 메모</strong>' +
                '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:12px;color:var(--text-muted);">태도 점수</span><input type="number" min="0" max="100" class="input mono" style="width:84px;" id="drAttScore" value="' + escapeHtml(ev.attitudeScore) + '" />' +
                ATTITUDE_ACTIONS.map(function (a) {
                  return '<button type="button" class="att-btn" data-action="quick-att" data-id="' + escapeHtml(st.id) + '" data-type="' + escapeHtml(a.type) + '">' + (a.delta > 0 ? '+' : '') + a.delta + ' ' + escapeHtml(a.label) + '</button>';
                }).join('') +
                '</div>' +
                '<textarea class="textarea" rows="3" id="drObsMemo" placeholder="수업 중 관찰한 학생의 질문, 탐구 과정, 성장 포인트 메모">' + escapeHtml(ev.observationMemo) + '</textarea>' +
                '</div>' +
                '</div>' +
                '<div class="modal-footer">' +
                '<div class="mono" style="font-size:13px;">종합 환산 점수: <strong style="color:var(--primary);">' + ev.totalScore + '점</strong></div>' +
                '<div style="display:flex;gap:8px;">' +
                '<button type="button" class="btn" data-action="drawer-save-all">저장</button>' +
                '<button type="button" class="btn btn-primary" data-action="drawer-save-and-ai">' + icon('sparkles', 13) + ' 저장 후 AI 세특</button>' +
                '</div></div></div></div>';
            }
          }

          return html;
        }

        function render() {
          document.documentElement.classList.toggle('dark', state.darkMode);
          syncSelectedClassAndActivity();

          var activeClass = getActiveClass();
          var classStudents = getClassStudents();
          var classActivities = getClassActivities();
          var activeActivity = getActiveActivity();

          var mainBody = '';

          if (state.banner) {
            mainBody +=
              '<div class="banner ' +
              (state.banner.type === 'error' ? 'banner-error' : 'banner-ok') +
              '"><span>' +
              escapeHtml(state.banner.text) +
              '</span><button type="button" class="btn" style="padding:3px 9px;" data-action="close-banner">닫기</button></div>';
          }

          if (!activeClass) {
            mainBody +=
              '<div class="card empty-card">' +
              '<div class="empty-icon">' + icon('book', 24) + '</div>' +
              '<h1 style="margin:0 0 10px;font-size:21px;">&lt;인공지능 기초&gt; 첫 수업 평가 공간을 준비해 보세요</h1>' +
              '<p style="margin:0 0 22px;color:var(--text-secondary);font-size:14px;">학급과 학생 명단을 직접 등록하거나, 2학년 3반 샘플 데이터를 불러와 루브릭·산출물·태도 평가와 세특 초안 작성을 바로 시작할 수 있습니다. 별도 서버나 빌드 없이 단일 index.html로 동작합니다.</p>' +
              '<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">' +
              '<button type="button" class="btn btn-primary" style="padding:10px 18px;font-size:13.5px;" data-action="seed-sample">' + icon('sparkles', 15) + ' 샘플 학급(2학년 3반) 불러오기</button>' +
              '<button type="button" class="btn" style="padding:10px 18px;font-size:13.5px;" data-action="open-class-modal">' + icon('plus', 15) + ' 직접 학급·명단 등록하기</button>' +
              '</div></div>';
          } else if (!activeActivity) {
            mainBody +=
              '<div class="card empty-card">' +
              '<div class="empty-icon">' + icon('book', 24) + '</div>' +
              '<p class="mono" style="margin:0 0 6px;font-size:12px;color:var(--text-muted);">' + escapeHtml(activeClass.name) + ' · 등록 학생 ' + classStudents.length + '명</p>' +
              '<h1 style="margin:0 0 10px;font-size:21px;">' + escapeHtml(activeClass.name) + '의 첫 평가 활동을 만들어 보세요</h1>' +
              '<p style="margin:0 0 22px;color:var(--text-secondary);font-size:14px;">교육과정 대단원을 선택하면 성취기준과 추천 루브릭이 자동으로 구성됩니다.</p>' +
              '<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">' +
              '<button type="button" class="btn btn-primary" style="padding:10px 18px;font-size:13.5px;" data-action="open-new-activity">' + icon('plus', 15) + ' 새 평가 활동 만들기</button>' +
              '<button type="button" class="btn" style="padding:10px 18px;font-size:13.5px;" data-action="open-class-modal">' + icon('users', 15) + ' 학생 명단 관리 (' + classStudents.length + '명)</button>' +
              '</div></div>';
          } else {
            mainBody +=
              '<div class="card context-header">' +
              '<div>' +
              '<div class="context-meta"><span>' + escapeHtml(activeClass.name) + '</span><span>·</span><span>영역 ' + escapeHtml(activeActivity.domainCode) + '. ' + escapeHtml(activeActivity.domainTitle) + '</span><span>·</span><span class="mono">' + escapeHtml(activeActivity.standards.join(', ')) + '</span></div>' +
              '<h1 class="context-title">' + escapeHtml(activeActivity.title) + '</h1>' +
              '<div class="mono" style="font-size:12px;color:var(--text-muted);">반영 비율: 루브릭 ' + activeActivity.weights.rubric + '% · 산출물 ' + activeActivity.weights.artifact + '% · 자기/동료 ' + activeActivity.weights.peerSelf + '% · 태도 ' + activeActivity.weights.attitude + '%</div>' +
              '</div>' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
              '<button type="button" class="btn" data-action="open-peer-import">' + icon('upload', 13) + ' 자기·동료평가 가져오기</button>' +
              '<button type="button" class="btn" data-action="edit-current-activity">루브릭 설정</button>' +
              '<button type="button" class="btn" data-action="export-csv">' + icon('download', 13) + ' CSV 내보내기</button>' +
              '</div></div>';

            if (state.activeView === 'eval') {
              mainBody += renderEvalTable(activeClass, activeActivity, classStudents);
            } else if (state.activeView === 'ai') {
              mainBody += renderAiStudio(activeActivity, classStudents);
            } else if (state.activeView === 'analytics') {
              mainBody += renderAnalytics(activeActivity, classStudents);
            }
          }

          var appEl = document.getElementById('app');
          appEl.innerHTML =
            '<div class="app-shell">' +
            renderTopBar(activeClass) +
            '<div class="workspace">' +
            renderSidebar(activeClass, classActivities) +
            '<main class="main-content">' +
            mainBody +
            '</main></div>' +
            renderModals(activeClass, classStudents, activeActivity) +
            '</div>';
        }

        function saveDrawerInputs() {
          var act = getActiveActivity();
          if (!act || !state.activeEvalStudentId) return null;
          var cur = getEvaluation(act.id, state.activeEvalStudentId) || createEmptyEvaluation(act.classId, act.id, state.activeEvalStudentId);
          var artScore = document.getElementById('drArtScore');
          var artSum = document.getElementById('drArtSummary');
          var artFb = document.getElementById('drArtFeedback');
          var selfScore = document.getElementById('drSelfScore');
          var peerScore = document.getElementById('drPeerScore');
          var selfNote = document.getElementById('drSelfNote');
          var peerNote = document.getElementById('drPeerNote');
          var attScore = document.getElementById('drAttScore');
          var obsMemo = document.getElementById('drObsMemo');

          return setEvaluation(act, state.activeEvalStudentId, {
            artifact: {
              score: artScore ? clampScore(artScore.value) : cur.artifact.score,
              summary: artSum ? artSum.value.trim() : cur.artifact.summary,
              feedback: artFb ? artFb.value.trim() : cur.artifact.feedback,
            },
            peerSelf: {
              selfScore: selfScore ? clampScore(selfScore.value) : cur.peerSelf.selfScore,
              selfNote: selfNote ? selfNote.value.trim() : cur.peerSelf.selfNote,
              peerScore: peerScore ? clampScore(peerScore.value) : cur.peerSelf.peerScore,
              peerNote: peerNote ? peerNote.value.trim() : cur.peerSelf.peerNote,
            },
            attitudeScore: attScore ? clampScore(attScore.value) : cur.attitudeScore,
            observationMemo: obsMemo ? obsMemo.value.trim() : cur.observationMemo,
          });
        }

        // Event Delegation
        document.addEventListener('click', function (e) {
          var target = e.target.closest('[data-action]');
          if (!target) return;
          var action = target.getAttribute('data-action');

          if (action === 'close-modal-backdrop' && e.target !== target) return;
          if (action === 'close-drawer-backdrop' && e.target !== target) return;

          var act = getActiveActivity();
          var cls = getActiveClass();

          switch (action) {
            case 'nav-eval':
              e.preventDefault();
              state.activeView = 'eval';
              render();
              break;
            case 'nav':
              state.activeView = target.getAttribute('data-view');
              if (state.activeView === 'ai' && act) {
                var stList = getClassStudents();
                var curSt = stList.find(function (s) { return s.id === state.aiTargetStudentId; }) || stList[0];
                if (curSt) {
                  state.aiTargetStudentId = curSt.id;
                  var curEv = getEvaluation(act.id, curSt.id);
                  state.aiDraftText = curEv ? (state.aiMode === 'seteuk' ? curEv.aiSeTeukDraft : curEv.aiFeedbackDraft) : '';
                }
              }
              render();
              break;
            case 'toggle-theme':
              state.darkMode = !state.darkMode;
              saveStateToStorage();
              render();
              break;
            case 'download-html':
              exportSingleHtml();
              break;
            case 'download-zip':
              exportGithubZip();
              break;
            case 'export-json':
              exportJsonBackup();
              break;
            case 'export-csv':
              exportCsv();
              break;
            case 'close-banner':
              state.banner = null;
              render();
              break;
            case 'seed-sample':
              seedSampleClassroom();
              render();
              break;
            case 'open-class-modal':
              state.modal = 'class';
              state.classModalEditStudentId = null;
              render();
              break;
            case 'open-new-activity':
              state.editingActivityId = null;
              state._activityDraft = null;
              state.modal = 'activity';
              render();
              break;
            case 'edit-current-activity':
              if (act) {
                state.editingActivityId = act.id;
                state._activityDraft = null;
                state.modal = 'activity';
                render();
              }
              break;
            case 'open-peer-import':
              state.modal = 'peerImport';
              render();
              break;
            case 'close-modal':
            case 'close-modal-backdrop':
              state.modal = null;
              state._activityDraft = null;
              render();
              break;
            case 'select-activity':
              state.selectedActivityId = target.getAttribute('data-id');
              state.inlineEditStudentId = null;
              saveStateToStorage();
              render();
              break;
            case 'set-group-filter':
              state.groupFilter = target.getAttribute('data-group');
              render();
              break;
            case 'create-class': {
              var cName = (document.getElementById('newClassName').value || '').trim();
              var cSem = (document.getElementById('newClassSemester').value || '2026-1학기').trim();
              if (!cName) {
                setBanner('error', '학급명을 입력해 주세요.');
                render();
                return;
              }
              var nc = { id: uid('cls'), name: cName, semester: cSem, subject: '인공지능 기초' };
              state.classes.push(nc);
              state.selectedClassId = nc.id;
              saveStateToStorage();
              render();
              break;
            }
            case 'delete-class':
              if (!cls) return;
              state.classes = state.classes.filter(function (c) { return c.id !== cls.id; });
              state.students = state.students.filter(function (s) { return s.classId !== cls.id; });
              state.activities = state.activities.filter(function (a) { return a.classId !== cls.id; });
              Object.keys(state.evaluations).forEach(function (k) {
                if (state.evaluations[k].classId === cls.id) delete state.evaluations[k];
              });
              syncSelectedClassAndActivity();
              saveStateToStorage();
              render();
              break;
            case 'add-student': {
              if (!cls) return;
              var num = (document.getElementById('addStuNum').value || '').trim();
              var nm = (document.getElementById('addStuName').value || '').trim();
              var grp = (document.getElementById('addStuGroup').value || '').trim();
              if (!num || !nm) {
                setBanner('error', '학번과 이름을 모두 입력해 주세요.');
                render();
                return;
              }
              state.students.push({ id: uid('stu'), classId: cls.id, studentNumber: num, name: nm, groupName: grp });
              saveStateToStorage();
              render();
              break;
            }
            case 'bulk-add-students': {
              if (!cls) return;
              var raw = document.getElementById('bulkStuText').value || '';
              var lines = raw.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
              var added = 0;
              lines.forEach(function (line) {
                var cols = line.split(/[,\t]+/).map(function (c) { return c.trim(); });
                if (cols[0] && cols[1]) {
                  state.students.push({ id: uid('stu'), classId: cls.id, studentNumber: cols[0], name: cols[1], groupName: cols[2] || '' });
                  added++;
                }
              });
              if (added > 0) setBanner('ok', added + '명의 학생을 등록했습니다.');
              saveStateToStorage();
              render();
              break;
            }
            case 'cm-edit-student':
              state.classModalEditStudentId = target.getAttribute('data-id');
              render();
              break;
            case 'cm-cancel-student':
              state.classModalEditStudentId = null;
              render();
              break;
            case 'cm-save-student': {
              var sid = target.getAttribute('data-id');
              var sNum = (document.getElementById('cmNum').value || '').trim();
              var sName = (document.getElementById('cmName').value || '').trim();
              var sGrp = (document.getElementById('cmGroup').value || '').trim();
              if (!sNum || !sName) {
                setBanner('error', '학번과 이름은 비워둘 수 없습니다.');
                render();
                return;
              }
              state.students = state.students.map(function (s) {
                return s.id === sid ? Object.assign({}, s, { studentNumber: sNum, name: sName, groupName: sGrp }) : s;
              });
              state.classModalEditStudentId = null;
              saveStateToStorage();
              render();
              break;
            }
            case 'cm-delete-student': {
              var delId = target.getAttribute('data-id');
              state.students = state.students.filter(function (s) { return s.id !== delId; });
              Object.keys(state.evaluations).forEach(function (k) {
                if (state.evaluations[k].studentId === delId) delete state.evaluations[k];
              });
              saveStateToStorage();
              render();
              break;
            }
            case 'save-activity': {
              if (!cls || !state._activityDraft) return;
              var d = state._activityDraft;
              d.title = (document.getElementById('actTitleInput').value || '').trim() || d.title;
              d.activityDate = document.getElementById('actDateInput').value || d.activityDate;
              var wSum = Number(d.weights.rubric) + Number(d.weights.artifact) + Number(d.weights.peerSelf) + Number(d.weights.attitude);
              if (wSum !== 100) {
                setBanner('error', '평가 영역별 반영 비율의 합계는 100%여야 합니다. (현재 ' + wSum + '%)');
                render();
                return;
              }
              var dom = CURRICULUM_DOMAINS.find(function (x) { return x.code === d.domainCode; }) || CURRICULUM_DOMAINS[0];
              if (state.editingActivityId) {
                state.activities = state.activities.map(function (a) {
                  return a.id === state.editingActivityId
                    ? Object.assign({}, a, {
                        title: d.title,
                        domainCode: dom.code,
                        domainTitle: dom.title,
                        standards: d.standards,
                        activityDate: d.activityDate,
                        weights: d.weights,
                        rubricCriteria: d.rubricCriteria,
                        checklistItems: d.checklistItems,
                      })
                    : a;
                });
              } else {
                var newAct = {
                  id: uid('act'),
                  classId: cls.id,
                  title: d.title,
                  domainCode: dom.code,
                  domainTitle: dom.title,
                  standards: d.standards,
                  activityDate: d.activityDate,
                  weights: d.weights,
                  rubricCriteria: d.rubricCriteria,
                  checklistItems: d.checklistItems,
                };
                state.activities.push(newAct);
                state.selectedActivityId = newAct.id;
              }
              state.modal = null;
              state._activityDraft = null;
              saveStateToStorage();
              render();
              break;
            }
            case 'delete-activity':
              if (!state.editingActivityId) return;
              state.activities = state.activities.filter(function (a) { return a.id !== state.editingActivityId; });
              Object.keys(state.evaluations).forEach(function (k) {
                if (state.evaluations[k].activityId === state.editingActivityId) delete state.evaluations[k];
              });
              state.modal = null;
              state._activityDraft = null;
              syncSelectedClassAndActivity();
              saveStateToStorage();
              render();
              break;
            case 'apply-peer-import': {
              if (!act) return;
              var pText = document.getElementById('peerImportTextarea').value || '';
              var pLines = pText.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
              var cStudents = getClassStudents();
              var matched = 0;
              pLines.forEach(function (line) {
                var cols = line.split(/[,\t]+/).map(function (c) { return c.trim(); });
                var st = cStudents.find(function (s) { return s.studentNumber === cols[0] || s.name === cols[0]; });
                if (st) {
                  var cur = getEvaluation(act.id, st.id) || createEmptyEvaluation(act.classId, act.id, st.id);
                  setEvaluation(act, st.id, {
                    peerSelf: {
                      selfScore: cols[1] !== undefined ? clampScore(cols[1]) : cur.peerSelf.selfScore,
                      selfNote: cols[2] !== undefined ? cols[2] : cur.peerSelf.selfNote,
                      peerScore: cols[3] !== undefined ? clampScore(cols[3]) : cur.peerSelf.peerScore,
                      peerNote: cols[4] !== undefined ? cols[4] : cur.peerSelf.peerNote,
                    },
                  });
                  matched++;
                }
              });
              state.modal = null;
              setBanner('ok', matched + '명의 자기·동료평가 데이터를 반영했습니다.');
              render();
              break;
            }
            case 'start-inline': {
              if (!act) return;
              var stId = target.getAttribute('data-id');
              var st = state.students.find(function (s) { return s.id === stId; });
              if (!st) return;
              var ev = getEvaluation(act.id, st.id);
              state.inlineEditStudentId = st.id;
              state.inlineDraft = {
                studentNumber: st.studentNumber,
                name: st.name,
                groupName: st.groupName || '',
                artifactScore: ev ? ev.artifact.score : 0,
                selfScore: ev ? ev.peerSelf.selfScore : 0,
                peerScore: ev ? ev.peerSelf.peerScore : 0,
                attitudeScore: ev ? ev.attitudeScore : 80,
              };
              render();
              break;
            }
            case 'cancel-inline':
              state.inlineEditStudentId = null;
              state.inlineDraft = null;
              render();
              break;
            case 'save-inline': {
              if (!act || !state.inlineDraft) return;
              var sid = target.getAttribute('data-id');
              var nNum = String(state.inlineDraft.studentNumber || '').trim();
              var nName = String(state.inlineDraft.name || '').trim();
              if (!nNum || !nName) {
                setBanner('error', '학번과 이름은 비워둘 수 없습니다.');
                render();
                return;
              }
              state.students = state.students.map(function (s) {
                return s.id === sid ? Object.assign({}, s, { studentNumber: nNum, name: nName, groupName: String(state.inlineDraft.groupName || '').trim() }) : s;
              });
              var baseEv = getEvaluation(act.id, sid) || createEmptyEvaluation(act.classId, act.id, sid);
              setEvaluation(act, sid, {
                artifact: Object.assign({}, baseEv.artifact, { score: clampScore(state.inlineDraft.artifactScore) }),
                peerSelf: Object.assign({}, baseEv.peerSelf, {
                  selfScore: clampScore(state.inlineDraft.selfScore),
                  peerScore: clampScore(state.inlineDraft.peerScore),
                }),
                attitudeScore: clampScore(state.inlineDraft.attitudeScore),
              });
              state.inlineEditStudentId = null;
              state.inlineDraft = null;
              saveStateToStorage();
              render();
              break;
            }
            case 'quick-att': {
              if (!act) return;
              var qSid = target.getAttribute('data-id');
              var qType = target.getAttribute('data-type');
              var actObj = ATTITUDE_ACTIONS.find(function (a) { return a.type === qType; });
              if (!actObj) return;
              var curEv = getEvaluation(act.id, qSid) || createEmptyEvaluation(act.classId, act.id, qSid);
              var nextAtt = clampScore(curEv.attitudeScore + actObj.delta);
              var logs = (curEv.attitudeLogs || []).concat([{ label: actObj.label, delta: actObj.delta, time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) }]);
              setEvaluation(act, qSid, { attitudeScore: nextAtt, attitudeLogs: logs });
              render();
              break;
            }
            case 'open-eval-drawer':
              state.activeEvalStudentId = target.getAttribute('data-id');
              render();
              break;
            case 'close-drawer':
            case 'close-drawer-backdrop':
              saveDrawerInputs();
              state.activeEvalStudentId = null;
              render();
              break;
            case 'drawer-prev': {
              saveDrawerInputs();
              var list = getClassStudents();
              var iPrev = list.findIndex(function (s) { return s.id === state.activeEvalStudentId; });
              if (iPrev > 0) state.activeEvalStudentId = list[iPrev - 1].id;
              render();
              break;
            }
            case 'drawer-next': {
              saveDrawerInputs();
              var listN = getClassStudents();
              var iNext = listN.findIndex(function (s) { return s.id === state.activeEvalStudentId; });
              if (iNext >= 0 && iNext < listN.length - 1) state.activeEvalStudentId = listN[iNext + 1].id;
              render();
              break;
            }
            case 'drawer-save-student': {
              var drNum = (document.getElementById('drStuNum').value || '').trim();
              var drName = (document.getElementById('drStuName').value || '').trim();
              var drGroup = (document.getElementById('drStuGroup').value || '').trim();
              if (!drNum || !drName) {
                setBanner('error', '학번과 이름은 비워둘 수 없습니다.');
                render();
                return;
              }
              state.students = state.students.map(function (s) {
                return s.id === state.activeEvalStudentId ? Object.assign({}, s, { studentNumber: drNum, name: drName, groupName: drGroup }) : s;
              });
              saveStateToStorage();
              setBanner('ok', '학생 기본 정보를 저장했습니다.');
              render();
              break;
            }
            case 'drawer-set-rubric': {
              if (!act || !state.activeEvalStudentId) return;
              saveDrawerInputs();
              var cid = target.getAttribute('data-cid');
              var lvl = target.getAttribute('data-lvl');
              var curE = getEvaluation(act.id, state.activeEvalStudentId) || createEmptyEvaluation(act.classId, act.id, state.activeEvalStudentId);
              var nextRubric = Object.assign({}, curE.rubricScores);
              nextRubric[cid] = lvl;
              setEvaluation(act, state.activeEvalStudentId, { rubricScores: nextRubric });
              render();
              break;
            }
            case 'drawer-save-all':
              saveDrawerInputs();
              setBanner('ok', '평가 내용을 저장했습니다.');
              render();
              break;
            case 'drawer-save-and-ai': {
              var saved = saveDrawerInputs();
              var sTargetId = state.activeEvalStudentId;
              state.activeEvalStudentId = null;
              state.aiTargetStudentId = sTargetId;
              state.activeView = 'ai';
              state.aiDraftText = saved ? (state.aiMode === 'seteuk' ? saved.aiSeTeukDraft : saved.aiFeedbackDraft) : '';
              render();
              break;
            }
            case 'go-ai': {
              var gId = target.getAttribute('data-id');
              state.aiTargetStudentId = gId;
              state.activeView = 'ai';
              if (act) {
                var gEv = getEvaluation(act.id, gId);
                state.aiDraftText = gEv ? (state.aiMode === 'seteuk' ? gEv.aiSeTeukDraft : gEv.aiFeedbackDraft) : '';
              }
              render();
              break;
            }
            case 'select-ai-student': {
              var aId = target.getAttribute('data-id');
              state.aiTargetStudentId = aId;
              state.aiEvidenceUsed = [];
              if (act) {
                var aEv = getEvaluation(act.id, aId);
                state.aiDraftText = aEv ? (state.aiMode === 'seteuk' ? aEv.aiSeTeukDraft : aEv.aiFeedbackDraft) : '';
              }
              render();
              break;
            }
            case 'set-ai-mode':
              state.aiMode = target.getAttribute('data-mode');
              state.aiEvidenceUsed = [];
              if (act && state.aiTargetStudentId) {
                var mEv = getEvaluation(act.id, state.aiTargetStudentId);
                state.aiDraftText = mEv ? (state.aiMode === 'seteuk' ? mEv.aiSeTeukDraft : mEv.aiFeedbackDraft) : '';
              }
              render();
              break;
            case 'generate-ai-draft': {
              if (!act) return;
              var stu = getClassStudents().find(function (s) { return s.id === state.aiTargetStudentId; });
              if (!stu) return;
              var evGen = getEvaluation(act.id, stu.id) || createEmptyEvaluation(act.classId, act.id, stu.id);
              var res = generateEvidenceDraft(stu, act, evGen, state.aiMode, state.aiFocusCompetency, state.aiTargetLength);
              state.aiDraftText = res.draftText;
              state.aiEvidenceUsed = res.evidenceUsed;
              render();
              break;
            }
            case 'batch-ai-seteuk': {
              if (!act) return;
              var allSt = getClassStudents();
              allSt.forEach(function (s) {
                var e = getEvaluation(act.id, s.id) || createEmptyEvaluation(act.classId, act.id, s.id);
                var r = generateEvidenceDraft(s, act, e, 'seteuk', state.aiFocusCompetency, state.aiTargetLength);
                setEvaluation(act, s.id, { aiSeTeukDraft: r.draftText });
              });
              var curSel = getEvaluation(act.id, state.aiTargetStudentId);
              if (state.aiMode === 'seteuk' && curSel) state.aiDraftText = curSel.aiSeTeukDraft;
              setBanner('ok', allSt.length + '명의 생활기록부 세특 초안을 일괄 생성했습니다.');
              render();
              break;
            }
            case 'save-ai-draft': {
              if (!act || !state.aiTargetStudentId) return;
              var txt = document.getElementById('aiDraftTextarea').value;
              state.aiDraftText = txt;
              if (state.aiMode === 'seteuk') setEvaluation(act, state.aiTargetStudentId, { aiSeTeukDraft: txt });
              else setEvaluation(act, state.aiTargetStudentId, { aiFeedbackDraft: txt });
              setBanner('ok', '초안을 학생 평가 기록에 저장했습니다.');
              render();
              break;
            }
            case 'copy-ai-draft': {
              var copyTxt = document.getElementById('aiDraftTextarea').value;
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(copyTxt).then(function () {
                  setBanner('ok', '클립보드에 복사했습니다.');
                  render();
                });
              }
              break;
            }
          }
        });

        document.addEventListener('change', function (e) {
          var el = e.target;
          var action = el.getAttribute('data-action');

          if (action === 'select-class') {
            state.selectedClassId = el.value;
            state.groupFilter = 'all';
            state.searchQuery = '';
            state.inlineEditStudentId = null;
            state.activeEvalStudentId = null;
            syncSelectedClassAndActivity();
            saveStateToStorage();
            render();
            return;
          }
          if (action === 'import-json' && el.files && el.files[0]) {
            var reader = new FileReader();
            reader.onload = function () {
              try {
                var parsed = JSON.parse(String(reader.result || '{}'));
                if (!Array.isArray(parsed.classes)) throw new Error('올바른 백업 파일이 아닙니다.');
                state.classes = parsed.classes;
                state.students = Array.isArray(parsed.students) ? parsed.students : [];
                state.activities = Array.isArray(parsed.activities) ? parsed.activities : [];
                state.evaluations = parsed.evaluations && typeof parsed.evaluations === 'object' ? parsed.evaluations : {};
                syncSelectedClassAndActivity();
                saveStateToStorage();
                setBanner('ok', 'JSON 백업 데이터를 복원했습니다.');
              } catch (err) {
                setBanner('error', err.message || '백업 파일 복원에 실패했습니다.');
              }
              render();
            };
            reader.readAsText(el.files[0]);
            return;
          }
          if (action === 'act-change-domain' && state._activityDraft) {
            var dom = CURRICULUM_DOMAINS.find(function (d) { return d.code === el.value; }) || CURRICULUM_DOMAINS[0];
            state._activityDraft.domainCode = dom.code;
            state._activityDraft.title = dom.title + ' 탐구 수행평가';
            state._activityDraft.standards = [dom.standards[0].code];
            state._activityDraft.rubricCriteria = dom.defaultRubrics.map(function (r, i) {
              return { id: 'rub_' + i + '_' + Date.now().toString(36), title: r.title, weight: r.weight, levels: r.levels };
            });
            state._activityDraft.checklistItems = dom.defaultChecklist.slice();
            render();
            return;
          }
          if (action === 'act-toggle-std' && state._activityDraft) {
            var code = el.getAttribute('data-code');
            var idx = state._activityDraft.standards.indexOf(code);
            if (el.checked && idx === -1) state._activityDraft.standards.push(code);
            if (!el.checked && idx !== -1) state._activityDraft.standards.splice(idx, 1);
            return;
          }
          if (action === 'drawer-toggle-check') {
            var act = getActiveActivity();
            if (!act || !state.activeEvalStudentId) return;
            var item = el.getAttribute('data-item');
            var cur = getEvaluation(act.id, state.activeEvalStudentId) || createEmptyEvaluation(act.classId, act.id, state.activeEvalStudentId);
            var list = cur.checklistChecked.slice();
            var i = list.indexOf(item);
            if (el.checked && i === -1) list.push(item);
            if (!el.checked && i !== -1) list.splice(i, 1);
            setEvaluation(act, state.activeEvalStudentId, { checklistChecked: list });
            return;
          }
          if (action === 'set-ai-competency') {
            state.aiFocusCompetency = el.value;
            return;
          }
          if (action === 'set-ai-length') {
            state.aiTargetLength = el.value;
            return;
          }
        });

        document.addEventListener('input', function (e) {
          var el = e.target;
          if (el.id === 'searchInput') {
            var pos = el.selectionStart;
            state.searchQuery = el.value;
            render();
            var nextInput = document.getElementById('searchInput');
            if (nextInput) {
              nextInput.focus();
              try { nextInput.setSelectionRange(pos, pos); } catch (err) {}
            }
            return;
          }
          if (el.id === 'aiDraftTextarea') {
            state.aiDraftText = el.value;
            return;
          }
          var inlineField = el.getAttribute('data-inline-field');
          if (inlineField && state.inlineDraft) {
            state.inlineDraft[inlineField] = el.value;
            var act = getActiveActivity();
            var previewEl = document.querySelector('[data-inline-preview-total]');
            if (act && previewEl && state.inlineEditStudentId) {
              var ev = getEvaluation(act.id, state.inlineEditStudentId);
              previewEl.textContent = String(
                computeTotalScore(act, {
                  rubricScores: ev ? ev.rubricScores : {},
                  artifact: { score: clampScore(state.inlineDraft.artifactScore) },
                  peerSelf: {
                    selfScore: clampScore(state.inlineDraft.selfScore),
                    peerScore: clampScore(state.inlineDraft.peerScore),
                  },
                  attitudeScore: clampScore(state.inlineDraft.attitudeScore),
                })
              );
            }
            return;
          }
          var wKey = el.getAttribute('data-act-weight');
          if (wKey && state._activityDraft) {
            state._activityDraft.weights[wKey] = Number(el.value) || 0;
            return;
          }
          var rtIdx = el.getAttribute('data-act-rubric-title');
          if (rtIdx !== null && state._activityDraft) {
            state._activityDraft.rubricCriteria[Number(rtIdx)].title = el.value;
            return;
          }
          var rwIdx = el.getAttribute('data-act-rubric-weight');
          if (rwIdx !== null && state._activityDraft) {
            state._activityDraft.rubricCriteria[Number(rwIdx)].weight = Number(el.value) || 0;
          }
        });

        loadStateFromStorage();
        render();
      })();
    </script></body></html>
