        border: none;

        padding: 4px 2px;
        font-size: 14px;
        font-weight: 500;

        white-space: nowrap;
        transition: color 0.15s, border-color 0.15s;

      .nav-tab:hover {
        color: var(--text);
      }

      .nav-tab.active {
        color: var(--text);
        font-weight: 600;

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;

        align-items: center;
        justify-content: center;
        gap: 6px;

        font-weight: 600;

        color: var(--text);

        cursor: not-allowed;

        background: var(--primary);
        border-color: var(--primary);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
        color: #ffffff;
      }

      .btn-danger {
        background: var(--danger-soft);
        border-color: var(--danger-border);
        color: var(--danger);
      }

      .btn-icon {
        padding: 7px;
        border-radius: 8px;

        background: var(--surface);
        color: var(--text-muted);

        gap: 22px;

      .main-content {

        display: flex;
        flex-direction: column;

        justify-content: space-between;

        font-size: 13px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--text);
        outline: none;

      .input:focus,

      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .activity-item {
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: transparent;
        transition: background 0.15s, border-color 0.15s;
      }

      .activity-item:hover {
        background: var(--surface-muted);
      }

      .activity-item.selected {
        background: var(--primary-soft);
        border-color: var(--primary-border);
      }

      .activity-meta {
        font-size: 11px;
        color: var(--text-muted);
      }

      .activity-title {
        font-size: 12.5px;
        font-weight: 600;
        margin-top: 2px;
        color: var(--text);
      }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Cards */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
      }

      .empty-card {
        max-width: 680px;
        margin: 32px auto;
        padding: 44px 32px;
        text-align: center;
      }

      .empty-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--primary-soft);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }

      .context-header {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .context-meta {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .context-title {
        font-size: 20px;
        font-weight: 700;
        margin: 4px 0;
        letter-spacing: -0.02em;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .search-box {
        position: relative;
      }

      .search-box svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-input {
        padding: 7px 10px 7px 32px;
        font-size: 12.5px;
        width: 210px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface);

      .seg-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--surface-muted);
        border-radius: 8px;
        flex-wrap: wrap;

        background: transparent;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 6px;
        color: var(--text-muted);
      }

      .seg-btn.active {
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
        box-shadow: var(--shadow-sm);
      }

      /* Table */
      .table-wrap {
        overflow-x: auto;
      }

      table {

        font-size: 13px;

      thead th {

        font-weight: 600;
        text-align: left;

        white-space: nowrap;

      tbody td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
        white-space: nowrap;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr:hover {
        background: var(--surface-hover);
      }

      .num-right {
        text-align: right;
      }

      .mini-input {
        padding: 4px 7px;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--text);
      }

      .att-btn {
        padding: 3px 7px;
        font-size: 11px;
        font-weight: 500;
        border-radius: 6px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text-secondary);
      }

      .att-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .total-score {
        font-weight: 700;
        font-size: 14px;
        color: var(--primary);
      }

      /* Banners & Notices */
      .banner {

        border-radius: 10px;
        font-size: 12.5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .banner-error {
        background: var(--danger-soft);
        border: 1px solid var(--danger-border);
        color: var(--danger);
      }

      .banner-ok {
        background: var(--emerald-soft);
        border: 1px solid var(--emerald-border);
        color: var(--emerald);
      }

      /* Modals & SlideOver */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(15, 23, 42, 0.52);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .backdrop.drawer-backdrop {
        justify-content: flex-end;
        padding: 0;
      }

      .modal {
        width: 100%;
        max-width: 720px;
        max-height: 90vh;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .drawer {
        width: 100%;
        max-width: 600px;
        height: 100vh;
        background: var(--surface);
        border-left: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
      }

      .modal-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .modal-footer {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        background: var(--surface-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .rubric-card {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .level-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .level-btn {
        padding: 8px 6px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text-secondary);
        text-align: center;
      }

      .level-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #ffffff;
      }

      .split-ai {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 18px;
      }

      .progress-track {
        height: 8px;
        border-radius: 6px;
        background: var(--surface-muted);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 6px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 6px;
        background: var(--primary-soft);
        color: var(--primary);
        border: 1px solid var(--primary-border);
      }

      .tag-ok {
        background: var(--emerald-soft);
        color: var(--emerald);
        border-color: var(--emerald-border);
      }

      @media (max-width: 960px) {
        .workspace {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .split-ai,
        .grid-4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .split-ai {
          grid-template-columns: 1fr;
        }
        .main-content {
          padding: 16px;
        }
        .topbar {
          padding: 10px 14px;
          flex-wrap: wrap;
        }
      }

      @media (max-width: 600px) {
        .grid-2,
        .grid-4,
        .level-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

        var LEVEL_POINTS = {
          excellent: 4,
          good: 3,

          needsWork: 1,

        function uid(prefix) {
          return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
        }

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function clampScore(value) {
          var n = Number(value);
          if (!isFinite(n)) return 0;
          return Math.max(0, Math.min(100, Math.round(n * 10) / 10));
        }

        function calculateNeisBytes(text) {
          var str = String(text || '');
          var bytes = 0;
          for (var i = 0; i < str.length; i++) {
            var code = str.charCodeAt(i);
            if (str[i] === '\n') bytes += 2;
            else if (code > 127) bytes += 3;
            else bytes += 1;
          }
          return bytes;
        }

        function computeRubricPercentage(activity, rubricScores) {
          if (!activity || !activity.rubricCriteria || !activity.rubricCriteria.length) return 0;
          var weightedSum = 0;
          var totalWeight = 0;
          activity.rubricCriteria.forEach(function (c) {
            var lvl = rubricScores ? rubricScores[c.id] : null;
            var ratio = lvl ? LEVEL_POINTS[lvl] / 4 : 0;
            weightedSum += ratio * c.weight;
            totalWeight += c.weight;
          });
          if (totalWeight <= 0) return 0;
          return Math.round((weightedSum / totalWeight) * 1000) / 10;
        }

        function computeTotalScore(activity, ev) {
          var w = activity.weights;
          var rubricPct = computeRubricPercentage(activity, ev.rubricScores);
          var artifactPct = clampScore(ev.artifact ? ev.artifact.score : 0);
          var selfS = ev.peerSelf ? ev.peerSelf.selfScore : 0;
          var peerS = ev.peerSelf ? ev.peerSelf.peerScore : 0;
          var peerSelfPct = clampScore((selfS + peerS) / 2);
          var attPct = clampScore(ev.attitudeScore != null ? ev.attitudeScore : 80);
          var total =
            (rubricPct * w.rubric +
              artifactPct * w.artifact +
              peerSelfPct * w.peerSelf +
              attPct * w.attitude) /
            100;
          return Math.round(total * 10) / 10;
        }

        // Pure JS ZIP generator (Store mode + CRC32) for file:// & Vercel compatibility
        var CRC_TABLE = (function () {
          var table = new Uint32Array(256);
          for (var n = 0; n < 256; n++) {
            var c = n;
            for (var k = 0; k < 8; k++) {
              c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            }
            table[n] = c >>> 0;
          }
          return table;
        })();

        function crc32(bytes) {
          var crc = 0xffffffff;
          for (var i = 0; i < bytes.length; i++) {
            crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
          }
          return (crc ^ 0xffffffff) >>> 0;
        }

        function buildSingleFileZip(fileName, contentText) {
          var encoder = new TextEncoder();
          var nameBytes = encoder.encode(fileName);
          var dataBytes = encoder.encode(contentText);
          var crc = crc32(dataBytes);
          var now = new Date();
          var dosTime =
            ((now.getHours() & 0x1f) << 11) |
            ((now.getMinutes() & 0x3f) << 5) |
            ((now.getSeconds() >> 1) & 0x1f);
          var dosDate =
            (((Math.max(1980, now.getFullYear()) - 1980) & 0x7f) << 9) |
            (((now.getMonth() + 1) & 0x0f) << 5) |
            (now.getDate() & 0x1f);

          var localHeaderSize = 30 + nameBytes.length;
          var centralHeaderSize = 46 + nameBytes.length;
          var endSize = 22;
          var totalSize = localHeaderSize + dataBytes.length + centralHeaderSize + endSize;
          var buffer = new Uint8Array(totalSize);
          var view = new DataView(buffer.buffer);

          // Local file header
          view.setUint32(0, 0x04034b50, true);
          view.setUint16(4, 20, true);
          view.setUint16(6, 0x0800, true); // UTF-8
          view.setUint16(8, 0, true); // Store
          view.setUint16(10, dosTime, true);
          view.setUint16(12, dosDate, true);
          view.setUint32(14, crc, true);
          view.setUint32(18, dataBytes.length, true);
          view.setUint32(22, dataBytes.length, true);
          view.setUint16(26, nameBytes.length, true);
          view.setUint16(28, 0, true);
          buffer.set(nameBytes, 30);
          buffer.set(dataBytes, localHeaderSize);

          var centralOffset = localHeaderSize + dataBytes.length;
          // Central directory header
          view.setUint32(centralOffset + 0, 0x02014b50, true);
          view.setUint16(centralOffset + 4, 20, true);
          view.setUint16(centralOffset + 6, 20, true);
          view.setUint16(centralOffset + 8, 0x0800, true);
          view.setUint16(centralOffset + 10, 0, true);
          view.setUint16(centralOffset + 12, dosTime, true);
          view.setUint16(centralOffset + 14, dosDate, true);
          view.setUint32(centralOffset + 16, crc, true);
          view.setUint32(centralOffset + 20, dataBytes.length, true);
          view.setUint32(centralOffset + 24, dataBytes.length, true);
          view.setUint16(centralOffset + 28, nameBytes.length, true);
          view.setUint16(centralOffset + 30, 0, true);
          view.setUint16(centralOffset + 32, 0, true);
          view.setUint16(centralOffset + 34, 0, true);
          view.setUint16(centralOffset + 36, 0, true);
          view.setUint32(centralOffset + 38, 0, true);
          view.setUint32(centralOffset + 42, 0, true);
          buffer.set(nameBytes, centralOffset + 46);

          var endOffset = centralOffset + centralHeaderSize;
          view.setUint32(endOffset + 0, 0x06054b50, true);
          view.setUint16(endOffset + 4, 0, true);
          view.setUint16(endOffset + 6, 0, true);
          view.setUint16(endOffset + 8, 1, true);
          view.setUint16(endOffset + 10, 1, true);
          view.setUint32(endOffset + 12, centralHeaderSize, true);
          view.setUint32(endOffset + 16, centralOffset, true);
          view.setUint16(endOffset + 20, 0, true);

          return new Blob([buffer], { type: 'application/zip' });
        }

            if (parsed && typeof parsed === 'object') {

              state.classes = Array.isArray(parsed.classes) ? parsed.classes : [];
              state.selectedClassId = parsed.selectedClassId || (state.classes[0] ? state.classes[0].id : '');
              state.students = Array.isArray(parsed.students) ? parsed.students : [];
              state.activities = Array.isArray(parsed.activities) ? parsed.activities : [];
              state.selectedActivityId = parsed.selectedActivityId || '';
              state.evaluations = parsed.evaluations && typeof parsed.evaluations === 'object' ? parsed.evaluations : {};
            }
          } catch (e) {
            // fallback to empty memory state if storage is unavailable
          }
          syncSelectedClassAndActivity();
        }

        function saveStateToStorage() {
          try {
            var payload = {
              darkMode: state.darkMode,
              classes: state.classes,
              selectedClassId: state.selectedClassId,
              students: state.students,
              activities: state.activities,
              selectedActivityId: state.selectedActivityId,
              evaluations: state.evaluations,
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          } catch (e) {
            // ignore storage quota errors
          }
        }

        function syncSelectedClassAndActivity() {
          if (!state.classes.some(function (c) { return c.id === state.selectedClassId; })) {
            state.selectedClassId = state.classes[0] ? state.classes[0].id : '';
          }
          var classActs = getClassActivities();
          if (!classActs.some(function (a) { return a.id === state.selectedActivityId; })) {
            state.selectedActivityId = classActs[0] ? classActs[0].id : '';
          }
          var classSts = getClassStudents();
          if (!classSts.some(function (s) { return s.id === state.aiTargetStudentId; })) {
            state.aiTargetStudentId = classSts[0] ? classSts[0].id : '';
          }
        }

        function getActiveClass() {
          return state.classes.find(function (c) { return c.id === state.selectedClassId; }) || null;
        }

        function getClassStudents() {
          return state.students
            .filter(function (s) { return s.classId === state.selectedClassId; })
            .slice()
            .sort(function (a, b) { return a.studentNumber.localeCompare(b.studentNumber, 'ko'); });
        }

        function getClassActivities() {
          return state.activities
            .filter(function (a) { return a.classId === state.selectedClassId; })
            .slice()
            .sort(function (a, b) { return (b.activityDate || '').localeCompare(a.activityDate || ''); });
        }

        function getActiveActivity() {
          return getClassActivities().find(function (a) { return a.id === state.selectedActivityId; }) || null;
        }

        function getEvaluation(activityId, studentId) {
          return state.evaluations[activityId + '_' + studentId] || null;
        }

        function setEvaluation(activity, studentId, patch) {
          var key = activity.id + '_' + studentId;
          var base = state.evaluations[key] || createEmptyEvaluation(activity.classId, activity.id, studentId);
          var next = Object.assign({}, base, patch, { updatedAt: new Date().toISOString() });
          next.totalScore = computeTotalScore(activity, next);
          state.evaluations[key] = next;
          saveStateToStorage();
          return next;
        }

        function generateEvidenceDraft(student, activity, ev, mode, focusCompetency, targetLength) {
          var rubricDetails = [];
          var evidence = [];
          activity.rubricCriteria.forEach(function (c) {
            var lvl = ev.rubricScores[c.id];
            if (lvl && c.levels[lvl]) {
              rubricDetails.push(c.levels[lvl]);
              evidence.push(c.title + '(' + LEVEL_LABELS[lvl].split(' ')[0] + ')');
            }
          });

          var checklistDone = (ev.checklistChecked || []).slice();
          if (checklistDone.length > 0) evidence.push('체크리스트 ' + checklistDone.length + '항목');
          if (ev.artifact && ev.artifact.summary) evidence.push('산출물 요약');
          if (ev.observationMemo) evidence.push('교사 관찰 메모');
          if (ev.peerSelf && (ev.peerSelf.selfNote || ev.peerSelf.peerNote)) evidence.push('자기·동료평가');
          if (evidence.length === 0) evidence.push(activity.domainTitle + ' 수업 참여');

          var cleanClause = function (txt) {
            return String(txt || '')
              .trim()
              .replace(/[.!?]+$/, '')
              .replace(/함$/, '하고')
              .replace(/임$/, '이며');
          };

          if (mode === 'feedback') {
            var parts = [];
            parts.push(
              student.name +
                ' 학생, 이번 「' +
                activity.title +
                '」(' +
                activity.domainTitle +
                ') 활동에 성실히 참여했어요.'
            );
            if (ev.artifact && ev.artifact.summary) {
              parts.push('특히 "' + ev.artifact.summary.replace(/[.]+$/, '') + '" 부분에서 핵심 개념을 실제 문제에 적용하려는 노력이 잘 드러났어요.');
            } else if (rubricDetails.length > 0) {
              parts.push('평가 과정에서도 ' + cleanClause(rubricDetails[0]) + ' 점이 돋보였어요.');
            }
            if (ev.observationMemo) {
              parts.push('수업 중 관찰한 "' + ev.observationMemo.replace(/[.]+$/, '') + '" 모습도 매우 인상적이었어요.');
            }
            if (ev.artifact && ev.artifact.feedback) {
              parts.push('교사 코멘트처럼 ' + ev.artifact.feedback.replace(/[.]+$/, '') + ' 부분을 이어가 보세요.');
            } else {
              parts.push('다음 활동에서는 실행 결과의 한계점과 개선 아이디어를 한 가지 더 구체적으로 정리해 보면 더욱 완성도가 높아질 거예요.');
            }
            return { draftText: parts.join(' '), evidenceUsed: evidence.slice(0, 4) };
          }

          // NEIS 세특 문체 생성
          var sentences = [];
          sentences.push(
            '「' +
              activity.title +
              '」 탐구 활동에서 ' +
              activity.domainTitle +
              ' 영역의 핵심 원리를 바탕으로 ' +
              focusCompetency +
              '을(를) 발휘함.'
          );

          if (ev.artifact && ev.artifact.summary) {
            sentences.push(ev.artifact.summary.trim().replace(/[.]+$/, '') + '.');
          } else if (rubricDetails.length > 0) {
            sentences.push(rubricDetails[0].trim().replace(/[.]+$/, '') + '.');
          }

          if (targetLength !== 'short' && checklistDone.length > 0) {
            var firstCheck = checklistDone[0].replace(/했는가\??$/, '하는 과정을 체계적으로 점검함.').replace(/서술했는가\??$/, '서술함.');
            sentences.push(firstCheck);
          }

          if (ev.observationMemo) {
            sentences.push(ev.observationMemo.trim().replace(/[.]+$/, '') + '.');
          }

          if (targetLength === 'detailed') {
            if (ev.peerSelf && ev.peerSelf.selfNote) {
              sentences.push(
                '자기 성찰 과정에서 ' +
                  ev.peerSelf.selfNote
                    .trim()
                    .replace(/했습니다\.?$/, '함을 스스로 확인함.')
                    .replace(/되었습니다\.?$/, '됨을 성찰함.')
                    .replace(/[.]+$/, '') +
                  '.'
              );
            }
            if (ev.peerSelf && ev.peerSelf.peerNote) {
              sentences.push('모둠 협력 활동에서도 동료들로부터 긍정적인 기여를 인정받으며 의사소통 역량을 보임.');
            }
          }

          var text = sentences
            .join(' ')
            .replace(/\.\./g, '.')
            .replace(/\s+/g, ' ')
            .trim();
          return { draftText: text, evidenceUsed: evidence.slice(0, 4) };
        }

          a.click();
          a.remove();
          setTimeout(function () {

        function exportCsv() {
          var cls = getActiveClass();
          var act = getActiveActivity();
          if (!cls || !act) return;
          var headers = [
            '학급',
            '활동명',
            '영역',
            '학번',
            '이름',
            '모둠',
            '루브릭환산점수',
            '산출물점수',
            '자기평가점수',
            '동료평가점수',
            '태도점수',
            '종합환산점수',
            '루브릭상세',
            '관찰메모',
            '학생피드백초안',
            '생활기록부세특초안',
          ];
          var esc = function (v) {
            return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
          };
          var rows = getClassStudents().map(function (st) {
            var ev = getEvaluation(act.id, st.id) || createEmptyEvaluation(cls.id, act.id, st.id);
            var rPct = computeRubricPercentage(act, ev.rubricScores);
            var rDet = act.rubricCriteria
              .map(function (c) {
                var l = ev.rubricScores[c.id];
                return c.title + ':' + (l ? LEVEL_LABELS[l] : '미평가');
              })
              .join(' | ');
            return [
              cls.name,
              act.title,
              act.domainTitle,
              st.studentNumber,
              st.name,
              st.groupName || '',
              rPct,
              ev.artifact.score,
              ev.peerSelf.selfScore,
              ev.peerSelf.peerScore,
              ev.attitudeScore,
              ev.totalScore,
              rDet,
              ev.observationMemo,
              ev.aiFeedbackDraft,
              ev.aiSeTeukDraft,
            ]
              .map(esc)
              .join(',');
          });
          var csv = '\uFEFF' + [headers.map(esc).join(','), rows.join('\r\n')].join('\r\n');
          triggerDownload(cls.name + '_' + act.title + '_평가결과.csv', new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        }

        function renderEvalTable(activeClass, activeActivity, classStudents) {

                  '<button type="button" class="seg-btn ' +
                  (state.groupFilter === g ? 'active' : '') +

                  : '<button type="button" class="link-btn" style="color:var(--text);font-weight:600;font-size:13px;" data-action="open-eval-drawer" data-id="' + escapeHtml(st.id) + '">' + escapeHtml(st.name) + '</button>') +
                '</td>' +
                '<td style="color:var(--text-muted);font-size:12px;">' +
                (isEdit
                  ? '<input type="text" class="mini-input" style="width:72px;" data-inline-field="groupName" value="' + escapeHtml(state.inlineDraft.groupName) + '" placeholder="모둠" />'
                  : escapeHtml(st.groupName || '-')) +
                '</td>' +
                '<td class="num-right mono" style="font-size:12px;"><span style="color:' +
                (rated === rTotal && rTotal > 0 ? 'var(--emerald)' : 'var(--text-muted)') +
                ';">' +
                rPct +
                ' (' +
                rated +
                '/' +
                rTotal +
                ')</span></td>' +
                '<td class="num-right mono">' +
                (isEdit
                  ? '<input type="number" min="0" max="100" class="mini-input mono" style="width:62px;text-align:right;" data-inline-field="artifactScore" value="' + escapeHtml(state.inlineDraft.artifactScore) + '" />'
                  : ev
                  ? ev.artifact.score

                '</td>' +
                '<td class="num-right mono">' +
                (isEdit
                  ? '<span style="display:inline-flex;align-items:center;gap:4px;">' +
                    '<input type="number" min="0" max="100" title="자기평가" class="mini-input mono" style="width:54px;text-align:right;" data-inline-field="selfScore" value="' + escapeHtml(state.inlineDraft.selfScore) + '" />' +
                    '/' +
                    '<input type="number" min="0" max="100" title="동료평가" class="mini-input mono" style="width:54px;text-align:right;" data-inline-field="peerScore" value="' + escapeHtml(state.inlineDraft.peerScore) + '" />' +
                    '</span>'
                  : peerSelfAvg) +
                '</td>' +
                '<td>' +
                (isEdit
                  ? '<input type="number" min="0" max="100" class="mini-input mono" style="width:62px;" data-inline-field="attitudeScore" value="' + escapeHtml(state.inlineDraft.attitudeScore) + '" />'
                  : '<div style="display:flex;align-items:center;gap:4px;">' +

                      })
                      .join('') +
                    '</div>') +
                '</td>' +
                '<td class="num-right mono total-score" data-inline-preview-total>' +
                previewTotal +
                '</td>' +
                '<td class="num-right">' +
                (isEdit
                  ? '<div style="display:inline-flex;gap:4px;">' +
                    '<button type="button" class="btn btn-primary" style="padding:5px 10px;" data-action="save-inline" data-id="' + escapeHtml(st.id) + '">' + icon('check', 13) + ' 저장</button>' +
                    '<button type="button" class="btn-icon" data-action="cancel-inline" aria-label="취소">' + icon('x', 13) + '</button>' +
                    '</div>'
                  : '<div style="display:inline-flex;gap:4px;">' +
                    '<button type="button" class="btn-icon" data-action="start-inline" data-id="' + escapeHtml(st.id) + '" title="학번·이름·점수 빠른 수정">' + icon('pencil', 13) + '</button>' +
                    '<button type="button" class="btn" style="padding:5px 10px;" data-action="open-eval-drawer" data-id="' + escapeHtml(st.id) + '">평가 입력</button>' +
                    '<button type="button" class="btn-icon" style="' + (ev && ev.aiSeTeukDraft ? 'border-color:var(--emerald-border);color:var(--emerald);' : '') + '" data-action="go-ai" data-id="' + escapeHtml(st.id) + '" title="AI 피드백·세특 작성">' + icon('sparkles', 13) + '</button>' +
                    '</div>') +
                '</td>' +
                '</tr>'

          return (
            '<div class="toolbar">' +

                '<table><thead><tr>' +
                '<th>학번</th><th>이름</th><th>모둠</th><th class="num-right">루브릭</th><th class="num-right">산출물</th><th class="num-right">자기·동료</th><th>수업 태도 빠른 체크</th><th class="num-right">총점</th><th class="num-right">평가/세특</th>' +
                '</tr></thead><tbody>' +
                rowsHtml +
                '</tbody></table></div>')
          );
        }

        function renderAiStudio(activeActivity, classStudents) {
          if (classStudents.length === 0) {
            return '<div class="card empty-card"><p style="color:var(--text-muted);">먼저 학급에 학생을 등록해 주세요.</p></div>';
          }
          var target = classStudents.find(function (s) { return s.id === state.aiTargetStudentId; }) || classStudents[0];
          var ev = getEvaluation(activeActivity.id, target.id) || createEmptyEvaluation(activeActivity.classId, activeActivity.id, target.id);
          var neisBytes = calculateNeisBytes(state.aiDraftText);

          var studentBtns = classStudents
            .map(function (st) {
              var stEv = getEvaluation(activeActivity.id, st.id);
              var hasDraft = stEv && (stEv.aiSeTeukDraft || stEv.aiFeedbackDraft);
              var active = st.id === target.id;
              return (
                '<button type="button" class="activity-item ' +
                (active ? 'selected' : '') +
                '" style="display:flex;align-items:center;justify-content:space-between;gap:8px;" data-action="select-ai-student" data-id="' +
                escapeHtml(st.id) +
                '">' +
                '<div><div class="mono" style="font-size:11px;color:var(--text-muted);">' +
                escapeHtml(st.studentNumber) +
                '</div><div style="font-size:13px;font-weight:600;">' +
                escapeHtml(st.name) +
                '</div></div>' +
                '<span class="' +
                (hasDraft ? 'tag tag-ok' : 'tag') +
                '">' +
                (hasDraft ? '작성됨' : '대기') +
                '</span>' +
                '</button>'
              );
            })
            .join('');

          return (
            '<div class="split-ai">' +
            '<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:8px;">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;">' +
            '<strong style="font-size:13px;">학생 선택 (' + classStudents.length + '명)</strong>' +
            '<button type="button" class="link-btn" data-action="batch-ai-seteuk">전체 자동 생성</button>' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;gap:4px;max-height:520px;overflow-y:auto;">' +
            studentBtns +
            '</div>' +
            '</div>' +
            '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:16px;">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
            '<div><div class="mono" style="font-size:12px;color:var(--text-muted);">' +
            escapeHtml(target.studentNumber) +
            ' · 총점 ' +
            ev.totalScore +
            '점</div><h2 style="margin:2px 0 0;font-size:17px;">' +
            escapeHtml(target.name) +
            ' 초안 작성 스튜디오</h2></div>' +
            '<div class="seg-group">' +
            '<button type="button" class="seg-btn ' + (state.aiMode === 'seteuk' ? 'active' : '') + '" data-action="set-ai-mode" data-mode="seteuk">생활기록부 세특</button>' +
            '<button type="button" class="seg-btn ' + (state.aiMode === 'feedback' ? 'active' : '') + '" data-action="set-ai-mode" data-mode="feedback">학생 피드백</button>' +
            '</div></div>' +
            '<div class="grid-2">' +
            '<div><label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">강조 핵심 역량</label>' +
            '<select class="select" data-action="set-ai-competency">' +
            ['인공지능 원리 이해 및 문제 해결 역량', '데이터 기반 추론 및 모델링 역량', 'AI 윤리 및 비판적 사고 역량', '협력적 의사소통 및 프로젝트 수행 역량']
              .map(function (c) {
                return '<option value="' + escapeHtml(c) + '"' + (state.aiFocusCompetency === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
              })
              .join('') +
            '</select></div>' +
            '<div><label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">서술 분량</label>' +
            '<select class="select" data-action="set-ai-length">' +
            [
              { v: 'short', l: '간결 (약 250~330자)' },
              { v: 'standard', l: '표준 (약 340~420자)' },
              { v: 'detailed', l: '상세 (약 430~500자)' },
            ]
              .map(function (o) {
                return '<option value="' + o.v + '"' + (state.aiTargetLength === o.v ? ' selected' : '') + '>' + o.l + '</option>';
              })
              .join('') +
            '</select></div></div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
            '<button type="button" class="btn btn-primary" data-action="generate-ai-draft">' + icon('sparkles', 14) + ' 평가 근거 기반 초안 생성</button>' +
            '<span class="mono" style="font-size:12px;color:var(--text-muted);">' + state.aiDraftText.length + '자 · NEIS ' + neisBytes + ' / 1500 Bytes</span>' +
            '</div>' +
            (state.aiEvidenceUsed.length > 0
              ? '<div style="display:flex;flex-wrap:wrap;gap:6px;">' +
                state.aiEvidenceUsed.map(function (e) { return '<span class="tag">' + escapeHtml(e) + '</span>'; }).join('') +
                '</div>'
              : '') +
            '<textarea class="textarea" rows="8" id="aiDraftTextarea" placeholder="초안 생성 버튼을 누르거나 직접 문구를 편집해 주세요.">' +
            escapeHtml(state.aiDraftText) +
            '</textarea>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
            '<div style="display:flex;gap:8px;">' +
            '<button type="button" class="btn btn-primary" data-action="save-ai-draft">' + icon('check', 14) + ' 학생 기록에 저장</button>' +
            '<button type="button" class="btn" data-action="copy-ai-draft">' + icon('copy', 14) + ' 복사</button>' +
            '</div>' +
            '<button type="button" class="btn" data-action="export-csv">' + icon('download', 14) + ' 전체 결과 CSV 내보내기</button>' +
            '</div></div></div>'
          );
        }

        function renderAnalytics(activeActivity, classStudents) {
          var total = classStudents.length;
          var evList = classStudents.map(function (s) {
            return getEvaluation(activeActivity.id, s.id) || createEmptyEvaluation(activeActivity.classId, activeActivity.id, s.id);
          });
          var completed = classStudents.filter(function (s) {
            var ev = getEvaluation(activeActivity.id, s.id);
            return ev && Object.keys(ev.rubricScores).length === activeActivity.rubricCriteria.length;
          }).length;
          var draftCount = evList.filter(function (e) { return Boolean(e.aiSeTeukDraft); }).length;
          var avgTotal = total ? Math.round((evList.reduce(function (a, b) { return a + b.totalScore; }, 0) / total) * 10) / 10 : 0;

          var avgRubric = total
            ? Math.round((evList.reduce(function (a, e) { return a + computeRubricPercentage(activeActivity, e.rubricScores); }, 0) / total) * 10) / 10
            : 0;
          var avgArt = total ? Math.round((evList.reduce(function (a, e) { return a + e.artifact.score; }, 0) / total) * 10) / 10 : 0;
          var avgPeer = total
            ? Math.round((evList.reduce(function (a, e) { return a + (e.peerSelf.selfScore + e.peerSelf.peerScore) / 2; }, 0) / total) * 10) / 10
            : 0;
          var avgAtt = total ? Math.round((evList.reduce(function (a, e) { return a + e.attitudeScore; }, 0) / total) * 10) / 10 : 0;

          var buckets = [
            { label: '90점 이상', count: 0 },
            { label: '80~89점', count: 0 },
            { label: '70~79점', count: 0 },
            { label: '60~69점', count: 0 },
            { label: '60점 미만', count: 0 },
          ];
          evList.forEach(function (e) {
            if (e.totalScore >= 90) buckets[0].count++;
            else if (e.totalScore >= 80) buckets[1].count++;
            else if (e.totalScore >= 70) buckets[2].count++;
            else if (e.totalScore >= 60) buckets[3].count++;
            else buckets[4].count++;
          });

          return (
            '<div class="grid-4">' +
            '<div class="card" style="padding:18px;"><div style="font-size:12px;color:var(--text-muted);">수강 학생 수</div><div class="mono" style="font-size:26px;font-weight:700;margin-top:4px;">' + total + '명</div></div>' +
            '<div class="card" style="padding:18px;"><div style="font-size:12px;color:var(--text-muted);">루브릭 평가 완료</div><div class="mono" style="font-size:26px;font-weight:700;margin-top:4px;">' + completed + '/' + total + '</div></div>' +
            '<div class="card" style="padding:18px;"><div style="font-size:12px;color:var(--text-muted);">평균 종합 점수</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--primary);margin-top:4px;">' + avgTotal + '점</div></div>' +
            '<div class="card" style="padding:18px;"><div style="font-size:12px;color:var(--text-muted);">세특 초안 작성</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--emerald);margin-top:4px;">' + draftCount + '/' + total + '</div></div>' +
            '</div>' +
            '<div class="grid-2">' +
            '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px;">' +
            '<h3 style="margin:0;font-size:15px;">점수 구간별 분포</h3>' +
            buckets
              .map(function (b) {
                var pct = total ? Math.round((b.count / total) * 100) : 0;
                return (
                  '<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>' +

                  b.count +

                  pct +

                  pct +
                  '%;"></div></div></div>'

              .join('') +
            '</div>' +
            '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;"><h3 style="margin:0;font-size:15px;">평가 요소별 평균 달성률</h3><button type="button" class="btn" data-action="export-csv">' + icon('download', 13) + ' CSV</button></div>' +

              { label: '루브릭 수행평가', val: avgRubric },

              { label: '자기·동료평가', val: avgPeer },

                  Math.min(100, row.val) +
                  '%;"></div></div></div>'
                );
              })
              .join('') +
            '</div></div>'

        function renderModals(activeClass, classStudents, activeActivity) {

                  '<td>' +
                  (editing ? '<input type="text" class="mini-input" style="width:92px;" id="cmName" value="' + escapeHtml(st.name) + '" />' : escapeHtml(st.name)) +
                  '</td>' +
                  '<td>' +
                  (editing ? '<input type="text" class="mini-input" style="width:76px;" id="cmGroup" value="' + escapeHtml(st.groupName || '') + '" />' : escapeHtml(st.groupName || '-')) +

                    : '<button type="button" class="btn-icon" data-action="cm-edit-student" data-id="' + escapeHtml(st.id) + '">' + icon('pencil', 13) + '</button> <button type="button" class="btn-icon" style="color:var(--danger);" data-action="cm-delete-student" data-id="' + escapeHtml(st.id) + '">' + icon('trash', 13) + '</button>') +
                  '</td>' +
                  '</tr>'

            html +=
              '<div class="backdrop" data-action="close-modal-backdrop">' +
              '<div class="modal">' +
              '<div class="modal-header"><strong>학급 및 학생 명단 관리</strong><button type="button" class="btn-icon" data-action="close-modal">' + icon('x', 15) + '</button></div>' +

              '<div style="padding:12px;border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;gap:10px;">' +
              '<strong style="font-size:13px;">새 학급 추가</strong>' +

              '<div style="display:flex;flex-direction:column;gap:6px;">' +
              activeDom.standards
                .map(function (st) {
                  var checked = draftAct.standards.indexOf(st.code) !== -1;
                  return (
                    '<label style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;cursor:pointer;">' +
                    '<input type="checkbox" data-action="act-toggle-std" data-code="' + escapeHtml(st.code) + '"' + (checked ? ' checked' : '') + ' />' +
                    '<span><strong class="mono">' + escapeHtml(st.code) + '</strong> ' + escapeHtml(st.text) + '</span></label>'
                  );

                .join('') +
              '</div></div>' +
              '<div><label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">평가 영역별 반영 비율 (합계 100%)</label>' +

                { k: 'rubric', l: '루브릭(%)' },

              '</div></div>' +
              '<div><label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">루브릭 평가 기준 (' + draftAct.rubricCriteria.length + '개)</label>' +
              '<div style="display:flex;flex-direction:column;gap:8px;">' +
              draftAct.rubricCriteria
                .map(function (rc, idx) {
                  return '<div style="display:flex;gap:8px;align-items:center;"><input type="text" class="input" data-act-rubric-title="' + idx + '" value="' + escapeHtml(rc.title) + '" /><input type="number" class="input mono" style="width:84px;" data-act-rubric-weight="' + idx + '" value="' + escapeHtml(rc.weight) + '" /></div>';

                .join('') +
              '</div></div>' +
              '</div>' +
              '<div class="modal-footer">' +

              '</div></div></div>';

          // Peer/Self Import Modal
          if (state.modal === 'peerImport' && activeActivity) {
            html +=
              '<div class="backdrop" data-action="close-modal-backdrop">' +
              '<div class="modal">' +
              '<div class="modal-header"><strong>자기평가·동료평가 일괄 가져오기</strong><button type="button" class="btn-icon" data-action="close-modal">' + icon('x', 15) + '</button></div>' +
              '<div class="modal-body">' +
              '<p style="font-size:12.5px;color:var(--text-muted);margin:0;">구글 설문지나 스프레드시트에서 복사한 데이터를 <strong>학번, 자기점수, 자기성찰, 동료점수, 동료코멘트</strong> 순서로 한 줄에 한 명씩 붙여넣으세요.</p>' +

                '<div class="modal-header">' +
                '<div><div class="mono" style="font-size:11px;color:var(--text-muted);">' + escapeHtml(st.studentNumber) + ' · ' + escapeHtml(st.groupName || '모둠 미지정') + '</div><strong style="font-size:16px;">' + escapeHtml(st.name) + ' 통합 평가 입력</strong></div>' +
                '<div style="display:flex;gap:6px;align-items:center;">' +
                '<button type="button" class="btn" style="padding:5px 9px;" data-action="drawer-prev" ' + (idx <= 0 ? 'disabled' : '') + '>이전</button>' +
                '<button type="button" class="btn" style="padding:5px 9px;" data-action="drawer-next" ' + (idx >= classStudents.length - 1 ? 'disabled' : '') + '>다음</button>' +
                '<button type="button" class="btn-icon" data-action="close-drawer">' + icon('x', 15) + '</button>' +
                '</div></div>' +
                '<div class="modal-body">' +
                '<div class="rubric-card">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;"><strong style="font-size:13px;">학생 기본 정보 수정</strong><button type="button" class="btn btn-primary" style="padding:4px 10px;" data-action="drawer-save-student">정보 저장</button></div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">' +
                '<input type="text" class="input mono" id="drStuNum" value="' + escapeHtml(st.studentNumber) + '" placeholder="학번" />' +
                '<input type="text" class="input" id="drStuName" value="' + escapeHtml(st.name) + '" placeholder="이름" />' +
                '<input type="text" class="input" id="drStuGroup" value="' + escapeHtml(st.groupName || '') + '" placeholder="모둠" />' +
                '</div></div>' +
                '<div style="display:flex;flex-direction:column;gap:10px;">' +
                '<strong style="font-size:13px;">1. 루브릭 수행평가</strong>' +
                activeActivity.rubricCriteria
                  .map(function (c) {
                    var cur = ev.rubricScores[c.id];
                    return (
                      '<div class="rubric-card">' +
                      '<div style="display:flex;justify-content:space-between;font-size:12.5px;"><strong>' + escapeHtml(c.title) + '</strong><span class="mono" style="color:var(--text-muted);">비중 ' + c.weight + '%</span></div>' +
                      '<div class="level-grid">' +
                      ['excellent', 'good', 'fair', 'needsWork']
                        .map(function (lvl) {

                            '<button type="button" class="level-btn ' + (cur === lvl ? 'active' : '') + '" data-action="drawer-set-rubric" data-cid="' + escapeHtml(c.id) + '" data-lvl="' + lvl + '">' +

                        .join('') +
                      '</div>' +
                      (cur ? '<div style="font-size:12px;color:var(--text-secondary);">' + escapeHtml(c.levels[cur]) + '</div>' : '') +
                      '</div>'

                  })
                  .join('') +
                '</div>' +
                '<div class="rubric-card"><strong style="font-size:13px;">2. 관찰 체크리스트</strong>' +
                activeActivity.checklistItems
                  .map(function (item) {
                    var checked = ev.checklistChecked.indexOf(item) !== -1;
                    return (
                      '<label style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;cursor:pointer;">' +
                      '<input type="checkbox" data-action="drawer-toggle-check" data-item="' + escapeHtml(item) + '"' + (checked ? ' checked' : '') + ' />' +

                  })
                  .join('') +
                '</div>' +
                '<div class="rubric-card"><strong style="font-size:13px;">3. 실습 산출물 평가</strong>' +
                '<div style="display:flex;align-items:center;gap:10px;"><label style="font-size:12px;color:var(--text-muted);">산출물 점수(0~100)</label><input type="number" min="0" max="100" class="input mono" style="width:90px;" id="drArtScore" value="' + escapeHtml(ev.artifact.score) + '" /></div>' +
